# Local infra for PROVING Layers 3/6/8 with real round-trips (not mocks).
# `pnpm infra:up` to start, `pnpm infra:down` to stop.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: playtest
      POSTGRES_PASSWORD: playtest
      POSTGRES_DB: playtestpool
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U playtest -d playtestpool"]
      interval: 2s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20
