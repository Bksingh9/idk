name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest

    # Real MongoDB + Redis so integration and E2E tests exercise true round-trips
    # (same as `pnpm infra:up` locally).
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # .env.local is gitignored; both vitest and Playwright load it via dotenv,
      # and Next reads it for `dev`/`build`. Point at the service containers.
      - name: Write CI env
        run: |
          cat > .env.local <<'EOF'
          NODE_ENV=test
          APP_BASE_URL=http://localhost:3000
          CORS_ALLOWED_ORIGINS=http://localhost:3000
          LOG_LEVEL=warn
          AUTH_JWT_SECRET=ci-test-secret-please-rotate-0123456789abcdef
          MONGODB_URI=mongodb://localhost:27017
          MONGODB_DB=playtestpool_ci
          REDIS_URL=redis://localhost:6379
          ADMIN_EMAILS=admin-e2e@example.com
          SIGNUP_RATE_LIMIT=1000
          EOF

      - name: Ensure Mongo indexes
        run: pnpm db:indexes

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit + integration tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E tests
        run: pnpm test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
